{% extends 'base.html' %}
{% block title %}Add Patient Record{% endblock %}
{% block page_title %}Add New Patient Record{% endblock %}

{% block content %}
<div class="card">
    <form method="POST" action="{{ url_for('patient.new_patient') }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 20px;">
            <div>
                <label for="patient_code">Patient Code</label>
                <input type="text" id="patient_code" name="patient_code" class="form-control" value="{{ form.patient_code if form else '' }}" required>
            </div>

            <div>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ form.name if form else '' }}" required>
            </div>

            <div>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="0" class="form-control" value="{{ form.age if form else '' }}">
            </div>

            <div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" class="form-control">
                    <option value="">Select gender</option>
                    <option value="Male" {% if form and form.get('gender') == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if form and form.get('gender') == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if form and form.get('gender') == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div>
                <label for="medical_condition">Medical Condition</label>
                <input type="text" id="medical_condition" name="medical_condition" class="form-control" value="{{ form.medical_condition if form else '' }}">
            </div>

            <div>
                <label for="current_location">Current Location</label>
                <input type="text" id="current_location" name="current_location" class="form-control" value="{{ form.current_location if form else '' }}">
            </div>

            <div>
                <label for="room_number">Room Number</label>
                <input type="text" id="room_number" name="room_number" class="form-control" value="{{ form.room_number if form else '' }}">
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" name="status" class="form-control">
                    <option value="Normal" {% if not form or form.get('status') == 'Normal' %}selected{% endif %}>Normal</option>
                    <option value="Attention Required" {% if form and form.get('status') == 'Attention Required' %}selected{% endif %}>Attention Required</option>
                    <option value="Alert" {% if form and form.get('status') == 'Alert' %}selected{% endif %}>Alert</option>
                </select>
            </div>

            <div>
                <label for="assigned_caregiver_id">Assigned Caregiver</label>
                <select id="assigned_caregiver_id" name="assigned_caregiver_id" class="form-control">
                    <option value="">Unassigned</option>
                    {% for caregiver in caregivers %}
                        <option value="{{ caregiver.id }}" {% if form and form.get('assigned_caregiver_id') == caregiver.id|string %}selected{% endif %}>{{ caregiver.full_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="rfid_tag_id">RFID Tag ID</label>
                <input type="text" id="rfid_tag_id" name="rfid_tag_id" class="form-control" value="{{ form.rfid_tag_id if form else '' }}">
            </div>

            <div>
                <label for="emergency_contact">Emergency Contact</label>
                <input type="text" id="emergency_contact" name="emergency_contact" class="form-control" value="{{ form.emergency_contact if form else '' }}">
            </div>

            <div style="grid-column: 1 / -1;">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="4">{{ form.notes if form else '' }}</textarea>
            </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Save Record</button>
            <a href="{{ url_for('patient.list_patients') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
